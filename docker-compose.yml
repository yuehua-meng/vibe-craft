name: vibe-craft

services:
  app:
    build: .
    image: vibe-craft:latest
    env_file:
      - .env
    environment:
      # 容器内端口固定 8010，与 deploy/Caddyfile 的 upstream 保持一致；
      # 对外端口由 caddy 的 80/443 决定，因此这里不映射宿主机端口。
      APP_HOST: 0.0.0.0
      APP_PORT: 8010
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
